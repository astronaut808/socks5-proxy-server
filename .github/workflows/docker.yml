name: Build and Push Docker image

on:
  pull_request:
  push:
    branches:
      - '**'
  release:
    types: [published, edited]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/socks5-proxy-server

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Go code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # cache отключён: workflow публикует артефакты (release build),
          # см. https://docs.zizmor.sh/audits/#cache-poisoning
          cache: false
      - name: Run tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Run golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 config verify
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

  build-and-push:
    name: Build and push
    if: github.event_name != 'pull_request'
    needs:
      - test
      - hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # публикация образа в GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: meta
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "tag=${BRANCH}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
      - name: Push Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
